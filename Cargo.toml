[workspace]
members = [
  "crates/core",
  "crates/api",
  "crates/audio",
  "crates/storage",
  "crates/graphics",
  "crates/ui",
  "crates/app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Tarek Mahmoud"]
repository = "https://github.com/heyitstarek/oxidify"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tracing = "0.1"
oxidify-core = { path = "crates/core" }
oxidify-api = { path = "crates/api" }
oxidify-audio = { path = "crates/audio" }
oxidify-storage = { path = "crates/storage" }
oxidify-graphics = { path = "crates/graphics" }
oxidify-ui = { path = "crates/ui" }
